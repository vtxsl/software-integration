name: CI Pipeline

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # for lint and format checks + dependencies
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Seteup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Check Formatting
        run: npm run format:check
      - name: Lint (EsLint)
        run: npm run lint

  build-and-test:
      name: Build and Test
      runs-on: ubuntu-latest

      steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Seteup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Check Formatting
        run: npm run format:check
      - name: Lint (EsLint)
        run: npm run lint
      - name: Compile TypeScript
        run: npm run build
      - name: Run Tests With Coverage
        run: npm run test -- --coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [quality, build-and-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Seteup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Check Formatting
        run: npm run format:check
      - name: Lint (EsLint)
        run: npm run lint

      - name: Build for production
        run: npm run build

      - name: Simulate deployment
        run: 
          echo "Deploying commit ${{ github.sha }}"
          echo "Deployed Successfully"